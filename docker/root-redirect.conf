# "/" is Relaticle's own marketing homepage. This install is a CRM, not a
# landing page, so the root sends the browser straight to the panel.
#
# `absolute_redirect off` makes nginx answer `Location: /app` instead of
# building an absolute URL from its own server_name — the browser then keeps
# whatever host and scheme it already used, which is the Traefik TLS origin.
#
# Only the exact path "/" is affected: /app, /pricing, /up, /reverb and the
# rest keep their own handlers.
location = / {
    absolute_redirect off;
    return 302 /app;
}
